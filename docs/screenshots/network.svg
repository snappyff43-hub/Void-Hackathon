<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#090d16" />
  <!-- Sidebar -->
  <rect width="220" height="540" fill="#0c111d" stroke="#1e293b" stroke-width="1" />
  <text x="24" y="38" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">CYBERTRACE</text>
  <text x="24" y="196" fill="#7c5cfc" font-family="sans-serif" font-size="12" font-weight="600">■ Network Graph</text>

  <!-- Canvas Header -->
  <g transform="translate(240, 20)">
    <text x="10" y="24" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Fraud Network Graph</text>
    <rect x="520" y="6" width="160" height="28" rx="6" fill="#7c5cfc" />
    <text x="600" y="24" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">TRACE MONEY FLOW</text>

    <!-- Graph Container -->
    <rect x="10" y="50" width="690" height="450" rx="8" fill="#0b0f19" stroke="#1e293b" />

    <!-- Graph Visual Nodes and Links -->
    <!-- Node 1: Victim -->
    <circle cx="90" cy="270" r="32" fill="#131b2e" stroke="#38bdf8" stroke-width="2" />
    <text x="90" y="266" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="700">VICTIM</text>
    <text x="90" y="278" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7">victim.user</text>

    <!-- Link 1 -> 2 -->
    <line x1="122" y1="270" x2="248" y2="270" stroke="#ef4444" stroke-width="3" />
    <text x="185" y="260" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="9" font-weight="700">₹75,000</text>

    <!-- Node 2: Mule VPA -->
    <circle cx="280" cy="270" r="32" fill="#450a0a" stroke="#ef4444" stroke-width="2.5" />
    <text x="280" y="266" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="8" font-weight="700">PRIMARY MULE</text>
    <text x="280" y="278" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7">mule01@bank</text>

    <!-- Link 2 -> 3 -->
    <line x1="312" y1="270" x2="438" y2="270" stroke="#f97316" stroke-width="3" />
    <text x="375" y="260" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="9" font-weight="700">₹68,000</text>

    <!-- Node 3: Intermediary -->
    <circle cx="470" cy="270" r="32" fill="#431407" stroke="#f97316" stroke-width="2" />
    <text x="470" y="266" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="8" font-weight="700">LAYER 2</text>
    <text x="470" y="278" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7">bridge02@bank</text>

    <!-- Link 3 -> 4 -->
    <line x1="502" y1="270" x2="618" y2="270" stroke="#a855f7" stroke-width="3" />
    <text x="560" y="260" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="9" font-weight="700">₹62,000</text>

    <!-- Node 4: Cash-out -->
    <circle cx="650" cy="270" r="32" fill="#3b0764" stroke="#a855f7" stroke-width="2" />
    <text x="650" y="266" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="8" font-weight="700">CASH-OUT</text>
    <text x="650" y="278" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7">XXXX9344</text>

    <!-- Telecom & Hardware Nodes Above -->
    <!-- Phone -->
    <circle cx="280" cy="120" r="28" fill="#131b2e" stroke="#38bdf8" stroke-width="1.5" />
    <text x="280" y="118" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="7" font-weight="700">PHONE</text>
    <text x="280" y="128" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7">9876500099</text>
    <line x1="280" y1="148" x2="280" y2="238" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- IMEI -->
    <circle cx="470" cy="120" r="28" fill="#131b2e" stroke="#a78bfa" stroke-width="1.5" />
    <text x="470" y="118" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="7" font-weight="700">IMEI</text>
    <text x="470" y="128" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7">356938...</text>
    <line x1="308" y1="120" x2="442" y2="120" stroke="#a78bfa" stroke-width="1.5" />

    <!-- IP -->
    <circle cx="650" cy="120" r="28" fill="#131b2e" stroke="#34d399" stroke-width="1.5" />
    <text x="650" y="118" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="7" font-weight="700">IP ADDRESS</text>
    <text x="650" y="128" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="7">103.84.21.77</text>
    <line x1="498" y1="120" x2="622" y2="120" stroke="#34d399" stroke-width="1.5" />
  </g>
</svg>
