  <text x="24" y="106" fill="#94a3b8" font-family="sans-serif" font-size="12">□ Investigations (3)</text>
  <text x="24" y="136" fill="#94a3b8" font-family="sans-serif" font-size="12">□ Evidence Vault (27)</text>
  <text x="24" y="166" fill="#94a3b8" font-family="sans-serif" font-size="12">□ Entities (18)</text>
  <text x="24" y="196" fill="#94a3b8" font-family="sans-serif" font-size="12">□ Network Graph</text>
  <text x="24" y="226" fill="#94a3b8" font-family="sans-serif" font-size="12">□ Timeline Replay</text>
