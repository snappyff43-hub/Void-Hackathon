      <text x="140" y="115" fill="#f8fafc" font-family="sans-serif" font-size="11">Trojanized APK Phishing Network</text>
      <text x="420" y="115" fill="#fbbf24" font-family="monospace" font-size="11">₹1,20,000</text>
      <rect x="520" y="103" width="60" height="18" rx="4" fill="#fb923c" fill-opacity="0.2" />
      <text x="526" y="116" fill="#fb923c" font-family="sans-serif" font-size="9" font-weight="700">MEDIUM</text>

