      <text x="12" y="52" fill="#7c5cfc" font-family="monospace" font-size="24" font-weight="700">3</text>
    </g>
    <g transform="translate(185, 60)">
      <rect width="160" height="75" rx="6" fill="#131b2e" stroke="#1e293b" />
      <text x="12" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="700">EVIDENCE ITEMS</text>
      <text x="12" y="52" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="700">27</text>
    </g>
    <g transform="translate(360, 60)">
