      <text x="12" y="20" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="700">CRITICAL LEADS</text>
      <text x="12" y="52" fill="#f43f5e" font-family="monospace" font-size="24" font-weight="700">3</text>
