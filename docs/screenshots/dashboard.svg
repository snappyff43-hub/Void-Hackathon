      <line x1="16" y1="135" x2="670" y2="135" stroke="#1e293b" />
      <text x="16" y="160" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">CASE-2026-003</text>
      <text x="140" y="160" fill="#f8fafc" font-family="sans-serif" font-size="11">SIM Swap &amp; Telecom Exfiltration</text>
      <text x="420" y="160" fill="#fbbf24" font-family="monospace" font-size="11">₹45,000</text>
      <rect x="520" y="148" width="60" height="18" rx="4" fill="#34d399" fill-opacity="0.2" />
      <text x="536" y="161" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">LOW</text>
