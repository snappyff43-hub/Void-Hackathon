<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <rect width="880" height="260" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <text x="30" y="38" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">CYBERTRACE — EVIDENCE PROCESSING PIPELINE</text>
  <text x="30" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">From raw file buffer to cryptographic integrity and canonical entity graph</text>

  <!-- Node 1: Input -->
  <g transform="translate(30, 90)">
    <rect width="130" height="120" rx="6" fill="#1e293b" stroke="#64748b" />
    <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">INPUT FILES</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="11">• CSV, XLSX</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11">• JSON, EML</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="11">• TXT, APK</text>
  </g>

  <!-- Arrow -->
  <path d="M 160 150 L 190 150" stroke="#7c5cfc" stroke-width="2" />

  <!-- Node 2: WebCrypto SHA-256 -->
  <g transform="translate(190, 90)">
    <rect width="150" height="120" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">INTEGRITY LOCK</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="11">• WebCrypto API</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11">• SHA-256 Hash</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="11">• Size &amp; Path Guard</text>
    <text x="14" y="108" fill="#34d399" font-family="sans-serif" font-size="9">✓ 0-Byte Exclusions</text>
  </g>

  <!-- Arrow -->
  <path d="M 340 150 L 370 150" stroke="#7c5cfc" stroke-width="2" />

  <!-- Node 3: Normalizer -->
  <g transform="translate(370, 90)">
    <rect width="150" height="120" rx="6" fill="#1e293b" stroke="#a855f7" />
    <text x="14" y="24" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">NORMALIZATION</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="11">• Phone E.164</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11">• Lowercase VPAs</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="11">• 15-Digit IMEIs</text>
    <text x="14" y="108" fill="#f8fafc" font-family="sans-serif" font-size="11">• IPv4 Octets</text>
  </g>

  <!-- Arrow -->
  <path d="M 520 150 L 550 150" stroke="#7c5cfc" stroke-width="2" />

  <!-- Node 4: Correlation -->
  <g transform="translate(550, 90)">
    <rect width="150" height="120" rx="6" fill="#1e293b" stroke="#fbbf24" />
    <text x="14" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">CORRELATION</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="11">• Shared Hardware</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11">• Telecom 2FA Link</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="11">• VPN Infrastructure</text>
    <text x="14" y="108" fill="#f8fafc" font-family="sans-serif" font-size="11">• Risk Matrix</text>
  </g>

  <!-- Arrow -->
  <path d="M 700 150 L 730 150" stroke="#7c5cfc" stroke-width="2" />

  <!-- Node 5: Output -->
  <g transform="translate(730, 90)">
    <rect width="120" height="120" rx="6" fill="#1e293b" stroke="#34d399" />
    <text x="14" y="24" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">OUTPUTS</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="11">• Network</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="11">• Timeline</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="11">• Copilot</text>
    <text x="14" y="108" fill="#f8fafc" font-family="sans-serif" font-size="11">• Brief Form</text>
  </g>
</svg>
