<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <rect width="880" height="230" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <text x="30" y="34" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">CYBERTRACE — GOLDEN-HOUR OPERATIONAL BRIEF WORKFLOW</text>
  <text x="30" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Translating raw multi-hop transaction intelligence into time-sensitive statutory freeze notices</text>

  <!-- Stage 1 -->
  <g transform="translate(30, 80)">
    <rect width="180" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">1. EVIDENCE INTAKE</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="10">• Bank CSV &amp; NPCI Logs</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="10">• CDR Telecom Dockets</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="10">• Telegram Chat Telemetry</text>
  </g>

  <!-- Arrow -->
  <path d="M 210 135 L 250 135" stroke="#7c5cfc" stroke-width="2" />

  <!-- Stage 2 -->
  <g transform="translate(250, 80)">
    <rect width="180" height="110" rx="6" fill="#1e293b" stroke="#ef4444" />
    <text x="14" y="24" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="700">2. RISK &amp; VELOCITY</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="10">• 3-Layer Hop Delta (6m 43s)</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="10">• Flagged Mules (Risk &gt; 80)</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="10">• Difference Calculation</text>
  </g>

  <!-- Arrow -->
  <path d="M 430 135 L 470 135" stroke="#7c5cfc" stroke-width="2" />

  <!-- Stage 3 -->
  <g transform="translate(470, 80)">
    <rect width="180" height="110" rx="6" fill="#1e293b" stroke="#fbbf24" />
    <text x="14" y="24" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">3. STATUTORY LEADS</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="10">• Sec 91 CrPC Bank Freeze</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="10">• Sec 67C IT Act Preservation</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="10">• CEIR IMEI Block Request</text>
  </g>

  <!-- Arrow -->
  <path d="M 650 135 L 690 135" stroke="#7c5cfc" stroke-width="2" />

  <!-- Stage 4 -->
  <g transform="translate(690, 80)">
    <rect width="160" height="110" rx="6" fill="#1e293b" stroke="#34d399" />
    <text x="14" y="24" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">4. COURT DOSSIER</text>
    <text x="14" y="50" fill="#f8fafc" font-family="sans-serif" font-size="10">• Data Classification</text>
    <text x="14" y="70" fill="#f8fafc" font-family="sans-serif" font-size="10">• Forensic Disclaimers</text>
    <text x="14" y="90" fill="#f8fafc" font-family="sans-serif" font-size="10">• Printer-Ready PDF</text>
  </g>
</svg>
