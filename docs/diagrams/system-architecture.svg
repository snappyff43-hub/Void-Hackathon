<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cfc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="0.05em">CYBERTRACE — SYSTEM ARCHITECTURE</text>
  <text x="40" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Deterministic Evidence Ingestion, Multi-Hop Correlation &amp; Grounded Copilot Workflow</text>
  <line x1="40" y1="82" x2="860" y2="82" stroke="#334155" stroke-width="1" />

  <!-- Flow Boxes -->
  <!-- Box 1: Ingestion -->
  <g transform="translate(40, 110)">
    <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardGlow)" />
    <rect width="240" height="28" rx="8" fill="rgba(56, 189, 248, 0.12)" />
    <text x="12" y="19" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">1. EVIDENCE INGESTION</text>
    <text x="14" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">• Multi-Format Intake</text>
    <text x="24" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">CSV, JSON, EML, XLSX, TXT</text>
    <text x="14" y="96" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">• WebCrypto SHA-256</text>
    <text x="24" y="114" fill="#94a3b8" font-family="sans-serif" font-size="11">Client-side 256-bit bitstream</text>
    <text x="14" y="138" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">✓ Path Traversal Stripped</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 280 185 L 320 185" stroke="#7c5cfc" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Box 2: Extraction & Resolution -->
  <g transform="translate(330, 110)">
    <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#7c5cfc" stroke-width="1.5" filter="url(#cardGlow)" />
    <rect width="240" height="28" rx="8" fill="rgba(124, 92, 252, 0.12)" />
    <text x="12" y="19" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">2. CORRELATION ENGINE</text>
    <text x="14" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">• Entity Normalization</text>
    <text x="24" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">Phones, VPAs, IMEIs, IPs</text>
    <text x="14" y="96" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">• Adjacency Resolution</text>
    <text x="24" y="114" fill="#94a3b8" font-family="sans-serif" font-size="11">Multi-hop graph edge links</text>
    <text x="14" y="138" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">✓ Explainable "Why Connected?"</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 570 185 L 610 185" stroke="#7c5cfc" stroke-width="2" />

  <!-- Box 3: Intelligence & Output -->
  <g transform="translate(620, 110)">
    <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#cardGlow)" />
    <rect width="240" height="28" rx="8" fill="rgba(251, 191, 36, 0.12)" />
    <text x="12" y="19" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">3. INVESTIGATION COPILOT</text>
    <text x="14" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">• Evidence Grounding</text>
    <text x="24" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">Deterministic query answers</text>
    <text x="14" y="96" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">• Tamper-Evident Audit</text>
    <text x="24" y="114" fill="#94a3b8" font-family="sans-serif" font-size="11">Chronological ledger logs</text>
    <text x="14" y="138" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">✓ Zero External API Keys</text>
  </g>

  <!-- Downward Flow to Output Panels -->
  <!-- Box 4: Visual Fraud Network -->
  <g transform="translate(40, 300)">
    <rect width="395" height="140" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">4. INTERACTIVE FRAUD TOPOLOGY</text>
    <text x="16" y="54" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Multi-hop SVG graph canvas with node dragging &amp; zoom</text>
    <text x="16" y="76" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Instant "Trace Money Flow" spotlight highlighting</text>
    <text x="16" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Sequential timeline replay (0.5x, 1x, 2x) synchronized with graph</text>
    <text x="16" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11">• Privacy masking protects PII during investigation projection</text>
  </g>

  <!-- Box 5: Golden-Hour Brief -->
  <g transform="translate(465, 300)">
    <rect width="395" height="140" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="28" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">5. GOLDEN-HOUR INVESTIGATION BRIEF</text>
    <text x="16" y="54" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Automated calculation of 3-layer transaction hop velocity</text>
    <text x="16" y="76" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Section 91 CrPC notice automation for urgent bank lien freezes</text>
    <text x="16" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Section 67C IT Act preservation summons for VPN/ISP endpoints</text>
    <text x="16" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11">• Formal court-ready print stylesheet with evidentiary disclaimers</text>
  </g>
</svg>
