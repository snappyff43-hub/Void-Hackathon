<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <rect width="800" height="360" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <text x="30" y="38" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">CYBERTRACE — ENTITY CORRELATION SCHEMA</text>
  <text x="30" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">How disparate forensic records bind into a single explainable identity nexus</text>

  <!-- Central Mule VPA -->
  <g transform="translate(310, 140)">
    <rect width="180" height="70" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="90" y="30" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="700">MULE VPA (UPI)</text>
    <text x="90" y="50" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="600">mule01@bank</text>
  </g>

  <!-- Payer Victim (Left) -->
  <g transform="translate(40, 140)">
    <rect width="180" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="90" y="30" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">VICTIM PAYER</text>
    <text x="90" y="50" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11">victim.user@okaxis</text>
  </g>

  <!-- Intermediary Node (Right) -->
  <g transform="translate(580, 140)">
    <rect width="180" height="70" rx="8" fill="#431407" stroke="#f97316" stroke-width="2" />
    <text x="90" y="30" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="11" font-weight="700">INTERMEDIARY</text>
    <text x="90" y="50" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="12">bridge02@bank</text>
  </g>

  <!-- Linked Phone (Top) -->
  <g transform="translate(310, 30)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="24" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">TELECOM MSISDN</text>
    <text x="90" y="44" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11">+91 98765 00099</text>
  </g>

  <!-- Handset IMEI & IP (Bottom) -->
  <g transform="translate(180, 260)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" />
    <text x="90" y="24" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="700">HANDSET IMEI</text>
    <text x="90" y="44" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11">356938035643809</text>
  </g>

  <g transform="translate(440, 260)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="90" y="24" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">VPN EXIT IP</text>
    <text x="90" y="44" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11">103.84.21.77</text>
  </g>

  <!-- Connecting Lines with Labels -->
  <!-- Victim to Mule -->
  <line x1="220" y1="175" x2="310" y2="175" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
  <text x="265" y="168" text-anchor="middle" fill="#fb7185" font-family="sans-serif" font-size="9" font-weight="600">₹75,000</text>

  <!-- Mule to Intermediary -->
  <line x1="490" y1="175" x2="580" y2="175" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" />
  <text x="535" y="168" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="9" font-weight="600">₹68,000</text>

  <!-- Phone to Mule -->
  <line x1="400" y1="90" x2="400" y2="140" stroke="#38bdf8" stroke-width="1.5" />
  <text x="408" y="118" fill="#94a3b8" font-family="sans-serif" font-size="8">Linked 2FA</text>

  <!-- Phone to IMEI -->
  <line x1="330" y1="90" x2="270" y2="260" stroke="#a78bfa" stroke-width="1.5" />
  <text x="280" y="200" fill="#94a3b8" font-family="sans-serif" font-size="8">CDR Tower</text>

  <!-- IMEI to IP -->
  <line x1="360" y1="290" x2="440" y2="290" stroke="#34d399" stroke-width="1.5" />
  <text x="400" y="284" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="8">Session</text>
</svg>
